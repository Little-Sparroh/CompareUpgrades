[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "CompareUpgrades"
description = "Press 'C' on an upgrade to lock for compare, press 'C' again on the same upgrade to unlock."
websiteUrl = "https://github.com/Little-Sparroh/CompareUpgrades"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/net48/CompareUpgrades.dll"
target = "BepInEx/plugins/CompareUpgrades.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "client" ]


